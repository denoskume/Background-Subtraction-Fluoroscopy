name: Validate reconstructed Background Subtraction notebook
on:
  push:
    paths:
      - 'notebooks/main.ipynb'
      - '.github/workflows/validate-reconstruction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-image scikit-learn matplotlib nbformat nbclient ipykernel
      - name: Validate notebook and run all 15 cells
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          path = Path("notebooks/main.ipynb")
          nb = nbformat.read(path, as_version=4)
          nbformat.validate(nb)
          assert len(nb.cells) == 15
          assert all(c.cell_type=="code" and "".join(c.source).strip() for c in nb.cells)
          out = NotebookClient(nb, timeout=240, kernel_name="python3", resources={"metadata":{"path":"notebooks"}}).execute()
          assert len(out.cells) == 15
          print("SUCCESS: 15 cells executed")
          PY
